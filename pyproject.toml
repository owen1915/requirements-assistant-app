[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incose-assistant-app"
version = "1.0.0"
description = "INCOSE requirements assistant: the deployed FastAPI + React prototype"
requires-python = ">=3.10"

# Installing the repo as a package is what lets `backend/main.py` do
# `from shared.evaluator import ...` regardless of the working directory it is
# launched from. Render's start command cds into backend/, so without this the
# import would only resolve by accident.
dependencies = [
    "anthropic>=0.86.0",
    "openai>=1.30.0",
    "python-dotenv==1.0.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The web stack. Kept as an extra so the package can be installed for its
# evaluator alone (which is how the research repo consumes an equivalent copy).
app = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "python-multipart==0.0.9",
    "python-docx==1.1.2",
    "rdflib==7.6.0",
    "pyshacl==0.31.0",
]

[tool.setuptools]
packages = ["shared"]

[tool.setuptools.package-data]
shared = ["rubrics/*.json"]
