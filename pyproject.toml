[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-assistant"
version = "1.0.0"
description = "INCOSE requirements assistant: UI prototype, n8n testbed, reviewer reliability, and the ICAIv2 rule pipeline"
requires-python = ">=3.10"

# The four components import a common core (`shared`). Before the split that
# worked only by accident — every tool was launched from `backend/`, which put
# the evaluator on sys.path. Declaring real packages here is what replaces that:
# `pip install -e .` makes every import below resolve from any working directory.
dependencies = [
    "anthropic>=0.86.0",
    "openai>=1.30.0",
    "python-dotenv==1.0.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The shipped prototype. Kept separate so a research-only checkout does not drag
# in the web stack, and so Render installs exactly this set.
app = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "python-multipart==0.0.9",
    "python-docx==1.1.2",
    "rdflib==7.6.0",
    "pyshacl==0.31.0",
]
# Scoring, plotting and the ICAIv2 clustering step.
research = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = [
    "shared",
    "n8n_testbed",
    "n8n_testbed.plots",
    "reviewer_reliability",
    "icai_v2",
    "icai_v2.pipeline",
    "icai_v2.app",
    "icai_v2.app.backend",
]

[tool.setuptools.package-data]
shared = ["rubrics/*.json"]
